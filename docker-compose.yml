# v2 application stack: Neo4j + FastAPI + Next.js
# Credentials and API keys are loaded from .env and never committed.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: medqa-neo4j
    restart: unless-stopped
    ports:
      # 注意：Windows 保留端口段（winnat 动态分配）若覆盖 7474/7687 会导致绑定失败。
      # 排查命令：netsh interface ipv4 show excludedportrange protocol=tcp
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - medqa-neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u "$$NEO4J_USER" -p "$$NEO4J_PASSWORD" "RETURN 1" >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: medqa-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      APP_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - ./lightrag_cache:/app/lightrag_cache
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j-init:
    profiles:
      - init
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: medqa-neo4j-init
    restart: "no"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./models:/app/models:ro
      - ./lightrag_cache:/app/lightrag_cache
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        python scripts/neo4j_bootstrap.py
        python scripts/index_docs.py --clear
        python scripts/import_graphml_to_neo4j.py
        python scripts/import_curated_to_neo4j.py
        python scripts/rebuild_curated_relations.py

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDQA_API_URL: ${NEXT_PUBLIC_MEDQA_API_URL:-http://localhost:8000}
    container_name: medqa-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  medqa-neo4j-data:
